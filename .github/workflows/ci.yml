name: Agrovet Ltd CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Code Quality, Security & Automated Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: agrovet_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript syntax linting
        run: npm run lint

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Verify production build validation
        run: npm run build

      - name: Run security & route guard tests
        run: |
          npm test
          npm run test:backend
          npm run test:security
          npm run test:polling
        env:
          DATABASE_URL: "postgresql://postgres:testpassword123@localhost:5432/agrovet_db"
          ADMIN_USERNAME: "Chalton"
          ADMIN_PASSWORD: "testpassword123"
          SESSION_SECRET: "ci_test_session_secret_1234567890abcdef1234567890abcdef"
          DARAJA_ENV: "sandbox"
          DARAJA_CONSUMER_KEY: "1LHAJJ4V0amvhCKlFbY3ZXCcGGDSchuQ8s2mu4nA5zGLmksl"
          DARAJA_CONSUMER_SECRET: "5BqHtSAGfh5lAmhKu5lNzfrIMG3GV3fS69yJ8IsGgzoarv7AUjRTACbTmt1XtqtK"
          DARAJA_BUSINESS_SHORTCODE: "174379"
          DARAJA_PASSKEY: "bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919"
          DARAJA_CALLBACK_URL: "https://agrovet.ltd/api/mpesa-callback"
          ADMIN_NOTIFICATION_EMAIL: "jjjanuaries@gmail.com"
