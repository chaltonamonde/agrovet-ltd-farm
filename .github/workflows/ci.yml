name: Agrovet Ltd CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Code Quality, Security & Automated Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript syntax linting
        run: npm run lint

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Verify production build validation
        run: npm run build

      - name: Run security & route guard tests
        run: npm test
        env:
          ADMIN_USERNAME: "Chalton"
          ADMIN_PASSWORD: "testpassword123"
          SESSION_SECRET: "ci_test_session_secret_1234567890abcdef1234567890abcdef"
          DARAJA_ENV: "sandbox"
